name: E2E

# uses real Supabase, Voyage and Gemini, so it runs on demand and weekly rather than on every push.
# 09:00 UTC is after the Gemini allowance resets at midnight Pacific, which 04:00 UTC was not: that
# was late evening Pacific, so the run met an allowance the day's evaluation had already spent.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # a spent Gemini allowance reports as skipped rather than failed, so a green run with four
      # of five tests is the expected shape on a day the evaluation set has used the allowance
      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
