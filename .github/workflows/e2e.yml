name: E2E

# uses real Supabase, Voyage and Gemini, so it runs on demand and weekly rather than on every push.
# 09:00 UTC is after the Gemini allowance resets at midnight Pacific, which 04:00 UTC was not: that
# was late evening Pacific, so the run met an allowance the day's evaluation had already spent.
#
# Monday and Thursday, not weekly. Github delays scheduled runs under load, so the gaps between
# "weekly" runs measured 7.0, 7.1 and 7.2 days, and Supabase pauses a free project after seven
# days without activity. A paused test project fails the run with a connection error, which looks
# like a broken test rather than a sleeping database. Twice a week keeps the gap near three days.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1,4'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # without this, missing secrets surface as a one second stack trace out of the
      # playwright config, which reads like a broken test rather than an unconfigured
      # repository. this ran red every week for a month before anyone noticed the
      # difference.
      - name: Check the secrets are configured
        run: |
          missing=""
          for key in E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_SUPABASE_SERVICE_ROLE_KEY VOYAGE_API_KEY GEMINI_API_KEY; do
            if [ -z "${!key}" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing"
            echo "Add them under Settings, Secrets and variables, Actions."
            echo "The Supabase values must come from the separate end-to-end project,"
            echo "never from the real one: these tests create and delete users and workspaces."
            exit 1
          fi
          echo "All five secrets are present."

      # a spent Gemini allowance reports as skipped rather than failed, so a green run with six
      # of seven tests is the expected shape on a day the evaluation set has used the allowance.
      #
      # the reason for a failure is echoed as an annotation because the job log needs a token to
      # read, and the notification email carries annotations but not the log. without this every
      # failure arrived as "process completed with exit code 1" and had to be reproduced locally
      # before anyone could tell an outage from a broken test.
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e-output.txt
          status=$?
          if [ $status -ne 0 ]; then
            summary=$(grep -m1 -E '^[[:space:]]+[0-9]+ (failed|passed|skipped)' e2e-output.txt | sed 's/^[[:space:]]*//')
            which=$(grep -m1 '✘' e2e-output.txt | sed 's/^[[:space:]]*//' | head -c 160)
            why=$(grep -m1 -E '(Error|TimeoutError): ' e2e-output.txt | sed 's/^[[:space:]]*//' | head -c 300)
            echo "::error::${summary:+$summary. }${which:+$which. }${why:-see the uploaded playwright-report artifact}"
          fi
          exit $status

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
